<script type="module">
import * as THREE from 'three';
import {Sky} from 'three/addons/objects/Sky.js';
import {GroundedSkybox} from 'three/addons/objects/GroundedSkybox.js';
const q=new URLSearchParams(location.search),v=q.get('v')||'flat',img=q.get('img');
const label=img?[q.get('t')||'GPT 파노라마','GPT로 그린 360° 배경 + 바닥에 붙는 하늘상자(GroundedSkybox)']:{flat:['현재','단색 배경 · 바닥만 있음'],sky:['A. 하늘 + 지평선','하늘 셰이더 + 넓은 잔디 바닥 + 안개'],pano:['B. 야외 파노라마 큐브맵','360° 배경 그림 + 바닥에 붙는 하늘상자(GroundedSkybox)'],indoor:['C. 실내 스튜디오 큐브맵','창문·벽이 있는 360° 실내 배경']}[v];
document.body.insertAdjacentHTML('beforeend',`<div class="tag">${label[0]}</div><div class="sub">${label[1]}</div>`);
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(1600,900);r.shadowMap.enabled=true;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=v==='sky'?.55:1;document.body.prepend(r.domElement);
const s=new THREE.Scene(),c=new THREE.PerspectiveCamera(50,16/9,.1,3000);c.position.set(8,3.4,10.5);c.lookAt(0,1.3,0);
s.add(new THREE.HemisphereLight('#ffffff','#8e9e91',v==='sky'?3:2.2));const d=new THREE.DirectionalLight('#fff',2.4);d.position.set(6,10,5);d.castShadow=true;d.shadow.mapSize.set(2048,2048);Object.assign(d.shadow.camera,{left:-10,right:10,top:10,bottom:-10});s.add(d);

/* 캔버스로 그린 등장방형(360°) 배경 */
function pano(kind){const w=2048,h=1024,cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d');
 if(kind==='outdoor'){
  let gr=g.createLinearGradient(0,0,0,h/2);gr.addColorStop(0,'#5d9ad6');gr.addColorStop(1,'#cfe6f5');g.fillStyle=gr;g.fillRect(0,0,w,h/2);

  g.fillStyle='#5f8f62';for(let x=0;x<w;x+=22){const th=18+((x*7)%23);g.beginPath();g.moveTo(x,h/2);g.lineTo(x+11,h/2-th-14);g.lineTo(x+22,h/2);g.fill();}
  gr=g.createLinearGradient(0,h/2,0,h);gr.addColorStop(0,'#86ad6c');gr.addColorStop(1,'#6f9858');g.fillStyle=gr;g.fillRect(0,h/2,w,h/2);

 }else{

  for(let i=0;i<4;i++){const x0=i*w/4;g.fillStyle='#e6ded2';g.fillRect(x0,0,6,h*.55);
   for(let j=0;j<2;j++){const x=x0+90+j*220,y=h*.2;g.fillStyle='#a8d0ea';g.fillRect(x,y,170,170);g.fillStyle='#ffffff';g.fillRect(x+82,y,6,170);g.fillRect(x,y+82,170,6);g.strokeStyle='#8a7a66';g.lineWidth=8;g.strokeRect(x,y,170,170);}

 }
 const t=new THREE.CanvasTexture(cv);t.mapping=THREE.EquirectangularReflectionMapping;t.colorSpace=THREE.SRGBColorSpace;return t;}

if(v==='flat'){s.background=new THREE.Color('#eaf0ed');const f=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:'#d7e1d4'}));f.rotation.x=-Math.PI/2;f.receiveShadow=true;s.add(f);const grid=new THREE.GridHelper(40,40,'#b9c7bd','#c9d4cc');grid.position.y=.002;s.add(grid);}
if(v==='sky'){const sky=new Sky();sky.scale.setScalar(2000);const u=sky.material.uniforms;u.turbidity.value=4;u.rayleigh.value=1.2;u.mieCoefficient.value=.004;u.mieDirectionalG.value=.8;u.sunPosition.value.setFromSphericalCoords(1,THREE.MathUtils.degToRad(70),THREE.MathUtils.degToRad(200));s.add(sky);
 s.fog=new THREE.Fog('#c4d8e6',30,120);const f=new THREE.Mesh(new THREE.CircleGeometry(400,64),new THREE.MeshStandardMaterial({color:'#9cbf86'}));f.rotation.x=-Math.PI/2;f.receiveShadow=true;s.add(f);
 const pad=new THREE.Mesh(new THREE.CircleGeometry(9,64),new THREE.MeshStandardMaterial({color:'#d8d1bf'}));pad.rotation.x=-Math.PI/2;pad.position.y=.005;pad.receiveShadow=true;s.add(pad);}
if(v==='pano'||v==='indoor'){const t=pano(v==='pano'?'outdoor':'indoor');s.environment=t;const sb=new GroundedSkybox(t,v==='pano'?6:3,v==='pano'?60:14);sb.position.y=(v==='pano'?6:3)-.01;s.add(sb);
 const sh=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.ShadowMaterial({opacity:.25}));sh.rotation.x=-Math.PI/2;sh.position.y=.003;sh.receiveShadow=true;s.add(sh);}

/* 같은 배치: 학생들이 꾸민 소파·탁자·책장·화분 */
const mat=col=>new THREE.MeshStandardMaterial({color:col,roughness:.8});
const box=(x,y,z,sx,sy,sz,col,ry=0)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat(col));m.position.set(x,y+sy/2,z);m.rotation.y=ry;m.castShadow=m.receiveShadow=true;s.add(m);};
box(-2.6,0,-3,3,.45,1,'#4e7a99');box(-2.6,.45,-3.4,3,.6,.3,'#4e7a99');box(0,0,.5,1.6,.75,1,'#a8754a');for(const x of [-1.1,1.1])box(x,0,.5,.45,.9,.45,'#8c5f3c');
box(3.6,0,-4.5,2.2,2.2,.5,'#7b5a3a');box(5,0,-1,.6,.5,.6,'#b5643c');const leaf=new THREE.Mesh(new THREE.SphereGeometry(.65,20,16),mat('#4f8a4a'));leaf.position.set(5,1.2,-1);leaf.castShadow=true;s.add(leaf);
box(3.5,0,2.5,1.2,.9,1.2,'#c7b08a',.4);box(-4.6,0,1.6,.25,1.7,.25,'#d9c27a');box(-4.6,1.7,1.6,.6,.35,.6,'#f4e3a1');
if(img){const t=await new THREE.TextureLoader().loadAsync(img);t.mapping=THREE.EquirectangularReflectionMapping;t.colorSpace=THREE.SRGBColorSpace;s.environment=t;s.environmentIntensity=.6;const sb=new GroundedSkybox(t,1.6*3,40);sb.position.y=1.6*3-.01;s.add(sb);

</script></body></html>
